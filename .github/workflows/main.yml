name: R-CI

on:
  push:
    branches: [ "master", "leandro/fixes_2026" ]
  pull_request:
    branches: [ "master" ]


jobs:
  build:
    runs-on: ubuntu-20.04
    
    strategy:
      matrix:
        r-version: ['3.6.3', '4.1.1', '4.5.2']

    env:
      R_VERSION: ${{ matrix.r-version }}

    steps:
      - uses: actions/checkout@v3
      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@f57f1301a053485946083d7a45022b278929a78a
        with:
          r-version: ${{ matrix.r-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            libproj-dev \
            libgeos-dev \
            libudunits2-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      - name: Install dependencies
        run: |
          R -e 'install.packages(c("remotes", "rcmdcheck"))'
          R -e 'remotes::install_deps(dependencies = TRUE)'
          R -e 'install.packages(c("adegenet", "vegan", "hierfstat", "spdep"), dependencies = TRUE)'
          R -e 'remotes::install_github("dyerlab/popgraph")'
          R -e 'remotes::install_github("dyerlab/gstudio")'
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and check
        run: R CMD build . && R CMD check --as-cran --no-manual *tar.gz
        env:
          _R_CHECK_CRAN_INCOMING_: false
          _R_CHECK_FORCE_SUGGESTS_: false

      - name: Check if on Linux and install
        if: runner.os == 'Linux'
        run: R CMD INSTALL *tar.gz

